<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0F1117">
<title>Doodleflip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23FF6B4A'/%3E%3Ccircle cx='32' cy='34' r='18' fill='%23FFD3C4' stroke='%231B1E27' stroke-width='3'/%3E%3Ccircle cx='26' cy='30' r='4' fill='%231B1E27'/%3E%3Ccircle cx='38' cy='30' r='4' fill='%231B1E27'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF6B4A;--coral-2:#FF8A6E;--sun:#FFC94A;--mint:#3DDC97;--sky:#4AA8FF;--before:#FF5A6E;--after:#4A8CFF;--paper:#FFF8EE;
  --ink-950:#0F1117;--ink-900:#161A23;--ink-800:#1E2330;--ink-700:#2A3142;--line:#232838;--line-2:#3A4256;
  --text:#F4F5F7;--muted:#8E96A8;--soft:#C9CEDA;--danger:#FF5A6E;
  --r-sm:10px;--r:14px;--r-lg:20px;--r-xl:26px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--ink-950);color:var(--text);font:14px/1.4 Inter,Cairo,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
[dir=rtl] body{font-family:Cairo,Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flip{transform:scaleX(1)}[dir=rtl] .flip{transform:scaleX(-1)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.xs{font-size:11px}.sm{font-size:13px}
.h2{font-size:20px;font-weight:700;margin:0}
.h3{font-size:16px;font-weight:600;margin:0}
.label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.num{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.btn{height:44px;border-radius:var(--r);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;background:var(--ink-800);color:var(--text);white-space:nowrap;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--coral);color:#fff;box-shadow:0 8px 24px rgba(255,107,74,.35)}
.btn.dark{background:var(--ink-950);color:#fff}
.btn.sm{height:36px;border-radius:var(--r-sm);padding:0 12px;font-size:13px}
.btn.block{width:100%;height:54px;border-radius:16px;font-size:16px}
.ib{width:40px;height:40px;border-radius:12px;background:var(--ink-800);display:inline-flex;align-items:center;justify-content:center;color:var(--soft);flex:none;transition:filter .15s}
.ib:hover{filter:brightness(1.2)}
.ib.sm{width:36px;height:36px}
.ib.round{border-radius:50%}
.chip{height:30px;padding:0 12px;border-radius:999px;background:var(--ink-800);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);white-space:nowrap;flex:none}
.chip svg.i{width:15px;height:15px}
.chip.on{background:rgba(255,107,74,.12);color:var(--coral-2);box-shadow:inset 0 0 0 1.5px var(--coral)}
.chip.glass{background:rgba(22,26,35,.93);box-shadow:inset 0 0 0 1px var(--ink-700)}
.chip.glass.on{box-shadow:inset 0 0 0 1.5px var(--coral)}
.seg{display:flex;background:var(--ink-950);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--ink-700);color:#fff}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--ink-700);position:relative;flex:none;cursor:pointer;margin:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.toggle:checked{background:var(--mint)}.toggle:checked::after{inset-inline-start:21px}
.sw{width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sw.on{box-shadow:0 0 0 3px var(--ink-900),0 0 0 5px #fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:none;margin:0;--p:50%;--c:var(--coral);cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--c) var(--p),var(--ink-700) var(--p))}
[dir=rtl] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to left,var(--c) var(--p),var(--ink-700) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--ink-700)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--c)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.slrow{display:flex;align-items:center;gap:14px}
.slrow>span:first-child{width:72px;flex:none;font-size:13px}
.slrow>b{width:40px;flex:none;text-align:end;font-weight:500;font-size:13px}
.card{background:var(--ink-900);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line)}
.opt{background:var(--ink-950);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow .15s,background .15s}
.opt.on{background:rgba(255,107,74,.08);box-shadow:inset 0 0 0 1.5px var(--coral)}
input[type=text]{width:100%;height:52px;border-radius:14px;background:var(--ink-950);border:0;box-shadow:inset 0 0 0 1px var(--line);padding:0 16px;font-size:16px;font-weight:500;outline:none;color:var(--text);user-select:text;-webkit-user-select:text}
input[type=text]:focus{box-shadow:inset 0 0 0 1.5px var(--coral)}
input[type=color]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.wheel{width:30px;height:30px;border-radius:50%;background:conic-gradient(#FF5A6E,#FFC94A,#3DDC97,#4AA8FF,#9B5CFF,#FF5A6E);flex:none;cursor:pointer;position:relative}

/* ---------- HOME ---------- */
#home{height:100%;overflow:auto;padding:max(12px,env(safe-area-inset-top)) 0 60px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 4px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--coral),var(--sun));display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.hero{margin-top:20px;border-radius:var(--r-xl);background:linear-gradient(135deg,#FF6B4A 0%,#FF8E6B 55%,#FFC94A 100%);position:relative;overflow:hidden;padding:24px;min-height:184px;color:#1B1E27;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.hero h1{font-size:23px;line-height:1.3;margin:0;max-width:200px;position:relative}
.hero p{margin:6px 0 0;font-size:13px;opacity:.78;max-width:200px;position:relative}
.hero .art{position:absolute;inset-inline-end:-6px;bottom:-14px;pointer-events:none}
.hero .art2{position:absolute;inset-inline-end:110px;bottom:14px;opacity:.35;pointer-events:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}
.tpls{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tpl{display:flex;flex-direction:column;align-items:center;gap:8px;width:78px;flex:none;font-size:11px;color:var(--muted);font-weight:500}
.tpl>div{width:78px;height:78px;border-radius:18px;background:var(--ink-900);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;transition:box-shadow .15s}
.tpl:hover>div{box-shadow:inset 0 0 0 1.5px var(--coral)}
.tpl i{display:block;background:var(--paper);border-radius:5px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.pcard{padding:8px;border-radius:18px;cursor:pointer;position:relative;transition:transform .15s}
.pcard:hover{transform:translateY(-2px)}
.pcard .im{aspect-ratio:16/10;border-radius:10px;background:var(--paper) center/cover no-repeat}
.pcard .meta{padding:10px 4px 2px}
.pcard .meta b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .more{position:absolute;top:14px;inset-inline-start:14px;width:30px;height:30px;border-radius:10px;background:rgba(15,17,23,.7);color:#fff;display:flex;align-items:center;justify-content:center}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}

/* ---------- EDITOR ---------- */
#editor{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 14px 8px}
.topbar .title b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-only{display:none!important}
#stagewrap{position:relative;min-height:0;display:flex;flex-direction:column}
#chips{display:flex;gap:8px;padding:2px 16px 8px;overflow-x:auto;scrollbar-width:none}
#view{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 45%,#1B2030,var(--ink-950) 70%)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.45);overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#fx{cursor:crosshair}
#gridov{pointer-events:none;position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.13) 1px,transparent 1px);background-size:calc(100%/16) calc(100%/9)}
#hud{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:8px;font-size:12px;pointer-events:none}
.dock{position:absolute;top:12px;left:12px;z-index:3;background:rgba(22,26,35,.93);border-radius:20px;box-shadow:var(--shadow),inset 0 0 0 1px var(--ink-700);padding:6px;display:flex;flex-direction:column;gap:3px;max-height:calc(100% - 24px);overflow-y:auto;scrollbar-width:none}
.tool{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--soft);flex:none;transition:background .15s}
.tool:hover{background:var(--ink-800)}
.tool.on{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(255,107,74,.4)}
.dock hr{border:0;height:1px;background:var(--ink-700);margin:4px 6px}
.cdot{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #fff;display:block}
#brushbar{margin:8px 16px 0;background:var(--ink-900);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);padding:8px 14px;display:flex;align-items:center;gap:14px}
#brushbar .col{flex:1;gap:0}
#brushbar .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
#brushbar .lab b{color:#fff;font-weight:500}
.bottom{background:var(--ink-900);border-radius:26px 26px 0 0;box-shadow:inset 0 1px 0 var(--line);padding:12px 16px max(10px,env(safe-area-inset-bottom));margin-top:10px}
.transport{display:flex;align-items:center;justify-content:space-between;gap:10px}
.play{width:52px;height:52px;border-radius:18px;background:var(--coral);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 20px rgba(255,107,74,.45);flex:none}
.play.stop{background:var(--danger)}
.counter{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.counter b{font-size:17px;font-weight:600}
.counter b span{color:var(--muted);font-weight:500}
.prog{height:3px;border-radius:2px;background:var(--ink-700);margin:12px 0 10px;position:relative;overflow:hidden}
.prog i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:var(--coral);border-radius:2px;width:0}
#strip{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 4px;scrollbar-width:none;touch-action:pan-x}
.th{flex:none;height:44px;border-radius:10px;position:relative;cursor:pointer;background:var(--paper);overflow:hidden}
.th canvas{height:100%;width:100%;display:block}
.th.sel{box-shadow:0 0 0 2.5px var(--coral)}
.th span{position:absolute;bottom:3px;inset-inline-end:3px;font:700 10px Inter,sans-serif;color:#1B1E27;background:rgba(255,255,255,.85);border-radius:5px;padding:0 5px}
.th.add{background:var(--ink-800);box-shadow:inset 0 0 0 1.5px var(--line-2);display:flex;align-items:center;justify-content:center;width:44px;color:var(--soft)}
.quick{display:flex;justify-content:space-between;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.quick button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:50px;padding:2px 0;flex:none}
.quick button.danger{color:var(--danger)}
#tgrid{display:none}
#scrim{position:fixed;inset:0;background:rgba(5,6,10,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--ink-900);border-radius:28px 28px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.5),inset 0 1px 0 var(--ink-700);padding:12px 20px max(24px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 14px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.tab{display:none;flex-direction:column;gap:16px}
.tab.on{display:flex}
.brushes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.brushes .opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.brushes .opt.on{color:var(--coral-2)}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:12px 6px;justify-items:center}
.lrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;cursor:pointer}
.lrow canvas{width:64px;height:40px;border-radius:6px;background:var(--paper);flex:none}
.lrow .tag{width:10px;height:10px;border-radius:3px;flex:none}
.menu{position:fixed;z-index:40;background:var(--ink-800);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--ink-700);padding:6px;min-width:170px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;text-align:start}
.menu button:hover{background:var(--ink-700)}
.menu button.danger{color:var(--danger)}
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fmt{padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;align-items:flex-start}
.fmt .ic{width:40px;height:40px;border-radius:12px;background:var(--ink-800);display:flex;align-items:center;justify-content:center;color:var(--soft)}
.fmt.on .ic{background:var(--coral);color:#fff}
.fmt .ck{position:absolute;top:12px;inset-inline-end:12px;width:22px;height:22px;border-radius:50%;background:var(--coral);display:none;align-items:center;justify-content:center;color:#fff}
.fmt.on .ck{display:flex}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;font-size:11px;font-weight:600;color:var(--soft)}
.size .box{height:56px;display:flex;align-items:center}
.size i{display:block;border-radius:5px;background:var(--line-2)}
.size.on{color:var(--coral-2)}.size.on i{background:var(--coral)}
.modal-sheet{max-width:560px;margin:0 auto}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:9px 16px;border-radius:20px;z-index:60;pointer-events:none;transition:opacity .25s;opacity:0;font-size:13px}

/* ---------- DESKTOP ---------- */
@media (min-width:1024px){
  .d-only{display:inline-flex!important}
  .m-only{display:none!important}
  #editor{grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:60px minmax(0,1fr) 260px}
  .topbar{grid-column:1/-1;background:var(--ink-900);box-shadow:inset 0 -1px 0 var(--line);padding:0 16px}
  #stagewrap{grid-column:1;grid-row:2}
  [dir=rtl] #stagewrap{grid-column:2}
  [dir=rtl] #editor{grid-template-columns:320px minmax(0,1fr)}
  #chips{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;padding:0}
  #panel{grid-column:2;grid-row:2;position:static;transform:none;visibility:visible;border-radius:0;max-height:none;box-shadow:inset 1px 0 0 var(--line);padding:18px;z-index:auto;transition:none}
  [dir=rtl] #panel{grid-column:1;box-shadow:inset -1px 0 0 var(--line)}
  #panel .grab,#panel .closep{display:none}
  .bottom{grid-column:1/-1;grid-row:3;margin:0;border-radius:0;padding:0;display:flex;flex-direction:column;min-height:0}
  .transport{height:56px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--line);justify-content:flex-start;flex:none}
  .play{width:44px;height:44px;border-radius:14px}
  .counter{flex-direction:row;gap:6px;margin:0 8px}
  .prog,#strip,.quick{display:none}
  #tgrid{display:block;flex:1;overflow:auto;direction:ltr;position:relative;min-height:0}
  .palette{gap:10px 4px}.palette .sw{width:28px;height:28px}
  #newsheet,#expsheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;border-radius:24px;transform:translate(-50%,-46%);opacity:0;transition:opacity .2s,transform .2s}
  #newsheet.show,#expsheet.show{opacity:1;transform:translate(-50%,-50%)}
  #newsheet .grab,#expsheet .grab{display:none}
}
.tg-head,.tg-row{display:flex;height:42px;align-items:center;min-width:max-content}
.tg-head{height:30px;position:sticky;top:0;background:var(--ink-900);z-index:2}
.tg-name{width:220px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;height:100%;box-shadow:inset -1px 0 0 var(--line);position:sticky;left:0;background:var(--ink-900);z-index:1;font-size:13px;font-weight:500;cursor:pointer}
.tg-row.sel,.tg-row.sel .tg-name{background:var(--ink-800)}
.tg-row.sel .tg-name{font-weight:600}
.tg-name .ib{width:26px;height:26px;background:none;border-radius:8px}
.tg-name .ib svg.i{width:16px;height:16px}
.cell{width:44px;height:100%;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell i{width:34px;height:26px;border-radius:7px;display:block}
.cell.cur{background:rgba(255,107,74,.08)}
.cell.cur.on i{box-shadow:0 0 0 2px #fff}
.cell.blank i{background:transparent!important;box-shadow:inset 0 0 0 1px var(--ink-700)}
.cell.blank.cur.on i{box-shadow:inset 0 0 0 2px #fff}
.fnum{width:44px;flex:none;text-align:center;font:600 10px Inter,sans-serif;color:#5B6378;cursor:pointer;display:flex;align-items:center;justify-content:center;height:100%}
.fnum.cur{color:var(--coral-2)}
#playhead{position:absolute;top:24px;width:2px;background:var(--coral);pointer-events:none;z-index:3}
#playhead::before{content:"";position:absolute;top:-4px;left:-7px;width:16px;height:10px;border-radius:3px;background:var(--coral)}
</style>
</head>
<body>

</div>

<script>
'use strict';
/* ---------- i18n ---------- */
const I18N={

',noVideo:'تصدير الفيديو غير مدعوم في هذا المتصفح',copied:'تم نسخ الإطار',pasted:'تم لصق الإطار',badFile:'ملف غير صالح',storageOff:'التخزين غير متاح — لن يُحفظ العمل',hide:'إخفاء',show:'إظهار',lock:'قفل',unlock:'فتح القفل',up:'لأعلى',down:'لأسفل',layerHidden:'الطبقة مخفية',layerLocked:'الطبقة مقفلة',duplicateProj:'نسخة',sec:'ث'},

om every frame?',encoding:'Encoding… {n}/{m}',recording:'Recording… {n}/{m}',done:'Exported!',noVideo:'Video export is not supported in this browser',copied:'Frame copied',pasted:'Frame pasted',badFile:'Invalid file',storageOff:'Storage unavailable — work will not be saved',hide:'Hide',show:'Show',lock:'Lock',unlock:'Unlock',up:'Move up',down:'Move down',layerHidden:'This layer is hidden',layerLocked:'This layer is locked',duplicateProj:'copy',sec:'s'}};
let lang='ar';try{lang=localStorage.getItem('df-lang')||'ar'}catch(e){}
const t=(k,v)=>{let s=(I18N[lang]&&I18N[lang][k])||I18N.en[k]||k;if(v)for(const a in v)s=s.replace('{'+a+'}',v[a]);return s};
const $=id=>document.getElementById(id);
const isDesk=()=>matchMedia('(min-width:1024px)').matches;
const icon=(n,s=20)=>`<svg class="i" style="width:${s}px;height:${s}px"><use href="#i-${n}"/></svg>`;
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-it]').forEach(e=>{e.title=t(e.dataset.it);e.setAttribute('aria-label',t(e.dataset.it))});
}
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1800)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pct=el=>((el.value-el.min)/(el.max-el.min)*100)+'%';
function setRange(el,v){el.value=v;el.style.setProperty('--p',pct(el))}
document.addEventListener('input',e=>{if(e.target.type==='range')e.target.style.setProperty('--p',pct(e.target))});

/* ---------- mascot: Blip, an original character drawn for this app ---------- */
function blip(w,pose=0,ghost=''){
  const dy=[0,-10,-22,-28,-18,-4][pose%6],sx=[1.12,1.02,.96,.94,.98,1.08][pose%6],sy=[.88,.98,1.05,1.06,1.02,.92][pose%6];
  const head=`<svg width="${w}" height="${Math.round(w*1.2)}" viewBox="0 -24 120 144">`;
  if(ghost){const st=`stroke="${ghost}" stroke-width="2.4" fill="none"`;return head+`<g transform="translate(60 ${100+dy}) scale(${sx} ${sy})"><path d="M0-78 C 4-90 14-92 14-84" ${st}/><ellipse cx="0" cy="-40" rx="38" ry="38" ${st}/><circle cx="-12" cy="-46" r="6" ${st}/><circle cx="12" cy="-46" r="6" ${st}/><path d="M-10-28 Q0-20 10-28" ${st}/><path d="M-16-4 L-18 6 M16-4 L18 6" ${st}/></g></svg>`}
  const d='#1B1E27';
  return head+`<ellipse cx="60" cy="108" rx="${30-dy*.5}" ry="5" fill="#000" fill-opacity="${.1+dy*.002}"/><g transform="translate(60 ${100+dy}) scale(${sx} ${sy})"><path d="M0-78 C 4-90 14-92 14-84" stroke="${d}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="15" cy="-84" r="5" fill="#FFC94A" stroke="${d}" stroke-width="3"/><path d="M-16-4 L-18 6 M16-4 L18 6" stroke="${d}" stroke-width="5" stroke-linecap="round"/><ellipse cx="0" cy="-40" rx="38" ry="38" fill="#FF6B4A" stroke="${d}" stroke-width="3.5"/><ellipse cx="0" cy="-26" rx="22" ry="15" fill="#FFD3C4"/><circle cx="-12" cy="-48" r="8" fill="#fff" stroke="${d}" stroke-width="3"/><circle cx="-10" cy="-47" r="3.6" fill="${d}"/><circle cx="12" cy="-48" r="8" fill="#fff" stroke="${d}" stroke-width="3"/><circle cx="14" cy="-47" r="3.6" fill="${d}"/><path d="M-9-31 Q0-23 9-31" stroke="${d}" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="-24" cy="-34" rx="5" ry="3" fill="#FF8FA3" fill-opacity=".7"/><ellipse cx="24" cy="-34" rx="5" ry="3" fill="#FF8FA3" fill-opacity=".7"/></g></svg>`;
}

/* ---------- storage ---------- */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('doodleflip',1);r.onupgradeneeded=()=>r.result.createObjectStore('projects',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function idb(mode,fn){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('projects',mode),r=fn(tx.objectStore('projects'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- home ---------- */
const SIZES=[['sLand','16:9',1280,720],['sStory','9:16',720,1280],['sSquare','1:1',1080,1080],['sClassic','4:3',1024,768]];
const LCOL=['#FF6B4A','#9B5CFF','#3DDC97','#4AA8FF','#FFC94A','#FF4FA3','#2EC4B6','#C68642'];
function relTime(ts){try{const rtf=new Intl.RelativeTimeFormat(lang,{numeric:'auto'});const s=(ts-Date.now())/1000;for(const [n,v] of [['year',31536e3],['month',2592e3],['week',604800],['day',86400],['hour',3600],['minute',60]])if(Math.abs(s)>=v)return rtf.format(Math.round(s/v),n);return rtf.format(0,'minute')}catch(e){return ''}}
function buildTemplates(){
  const h=$('tpls');h.innerHTML='';
  SIZES.forEach(([k,r,w,hh],i)=>{const b=document.createElement('button');b.className='tpl';const sc=46/Math.max(w,hh);b.innerHTML=`<div><i style="width:${w*sc}px;height:${hh*sc}px"></i></div><span>${t(k)} <span class="num">${r}</span></span>`;b.onclick=()=>openNew(i);h.append(b)});
}
async function renderHome(){
  const list=$('plist');list.innerHTML='';
  let ps=[];try{ps=await idb('readonly',s=>s.getAll())}catch(e){toast(t('storageOff'))}
  ps.sort((a,b)=>b.updated-a.updated);$('pcount').textContent=ps.length;$('pcount').classList.toggle('hidden',!ps.length);
  if(!ps.length){const d=document.createElement('div');d.className='empty';d.innerHTML=blip(90,4)+`<span>${t('noProjects')}</span>`;list.append(d);return}
  for(const p of ps){
    const c=document.createElement('div');c.className='card pcard';
    c.innerHTML=`<div class="im"></div><button class="more">${icon('more',18)}</button><div class="meta"><b></b><div class="row xs muted" style="gap:6px;margin-top:4px"><span class="num">${p.frames.length} ${t('frames')}</span><span>•</span><span class="num">${p.fps} fps</span></div><div class="xs muted">${relTime(p.updated)}</div></div>`;
    const im=c.querySelector('.im');im.style.backgroundColor=p.bg;if(p.thumb)im.style.backgroundImage=`url(${p.thumb})`;
    c.querySelector('b').textContent=p.name;
    c.querySelector('.more').onclick=e=>{e.stopPropagation();popMenu(e.currentTarget,[
      ['edit',t('rename'),async()=>{const n=prompt(t('projectName'),p.name);if(n){p.name=n.slice(0,60);await idb('readwrite',s=>s.put(p));renderHome()}}],
      ['copy',t('duplicate'),async()=>{await idb('readwrite',s=>s.put({...p,id:uid(),name:p.name+' — '+t('duplicateProj'),updated:Date.now()}));renderHome()}],
      ['trash',t('delete'),async()=>{if(confirm(t('confirmDel'))){await idb('readwrite',s=>s.delete(p.id));renderHome()}},1]])};
    c.onclick=()=>openProject(p);list.append(c);
  }
}
function popMenu(anchor,items){
  closeMenu();const m=document.createElement('div');m.className='menu';m.id='menu';
  for(const [ic,label,fn,danger] of items){const b=document.createElement('button');b.innerHTML=icon(ic,18)+`<span>${label}</span>`;if(danger)b.className='danger';b.onclick=e=>{e.stopPropagation();closeMenu();fn()};m.append(b)}
  document.body.append(m);const r=anchor.getBoundingClientRect();
  const x=Math.min(innerWidth-m.offsetWidth-8,Math.max(8,lang==='ar'?r.left:r.right-m.offsetWidth));let y=r.bottom+6;if(y+m.offsetHeight>innerHeight-8)y=r.top-m.offsetHeight-6;
  m.style.left=x+'px';m.style.top=y+'px';setTimeout(()=>addEventListener('pointerdown',closeMenuOut),0);
}
function closeMenuOut(e){if(!e.target.closest('#menu'))closeMenu()}
function closeMenu(){const m=$('menu');if(m)m.remove();removeEventListener('pointerdown',closeMenuOut)}
$('langbtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('df-lang',lang)}catch(e){};applyLang();buildTemplates();renderHome();buildNewSheet();buildFormats();if(P){refreshAll();requestAnimationFrame(fit)}};
$('importbtn').onclick=()=>$('importfile').click();
$('importfile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j.frames||!j.layers||!j.w)throw 0;
    const frames=await Promise.all(j.frames.map(fr=>Promise.all(fr.map(u=>u?fetch(u).then(r=>r.blob()):null))));
    const p={id:uid(),name:String(j.name||t('untitled')).slice(0,60),w:+j.w,h:+j.h,fps:+j.fps||12,bg:j.bg||'#FFF8EE',layers:j.layers.map((l,i)=>({color:LCOL[i%8],locked:false,...l})),frames,updated:Date.now(),thumb:j.thumb||null};
    await idb('readwrite',s=>s.put(p));renderHome();
  }catch(err){toast(t('badFile'))}
};

/* ---------- sheets ---------- */
let openSheet=null;
function showSheet(el){closeSheets();el.classList.add('show');$('scrim').classList.add('show');openSheet=el}
function closeSheets(){document.querySelectorAll('.sheet.show').forEach(s=>{if(!(s.id==='panel'&&isDesk()))s.classList.remove('show')});$('scrim').classList.remove('show');openSheet=null}
$('scrim').onclick=closeSheets;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
$('closepanel').onclick=closeSheets;
document.querySelectorAll('.sheet').forEach(s=>{let y0=null;s.addEventListener('touchstart',e=>{if(e.target.closest('.grab,.sheethead'))y0=e.touches[0].clientY},{passive:true});s.addEventListener('touchmove',e=>{if(y0!=null&&e.touches[0].clientY-y0>70){y0=null;closeSheets()}},{passive:true});s.addEventListener('touchend',()=>y0=null)});

/* ---------- new project ---------- */
const np={size:0,fps:12,bg:'#FFF8EE'};
const BGS=['#FFF8EE','#FFFFFF','#1B1E27','#CFEFD9','#D8E8FF','#FFE3EC'];
function buildNewSheet(){
  const s=$('npsizes');s.innerHTML='';
  SIZES.forEach(([k,r,w,h],i)=>{const b=document.createElement('button');b.className='opt size'+(i===np.size?' on':'');const sc=48/Math.max(w,h);b.innerHTML=`<div class="box"><i style="width:${w*sc}px;height:${h*sc}px"></i></div><span>${t(k)}</span><span class="xs muted num">${r}</span>`;b.onclick=()=>{np.size=i;buildNewSheet()};s.append(b)});
  const f=$('npfps');f.innerHTML='';[6,8,12,24,30,60].forEach(v=>{const b=document.createElement('button');b.className='chip'+(v===np.fps?' on':'');b.textContent=v;b.onclick=()=>{np.fps=v;buildNewSheet()};f.append(b)});
  const g=$('npbg');g.innerHTML='';BGS.forEach(c=>{const b=document.createElement('button');b.className='sw'+(c===np.bg?' on':'');b.style.background=c;b.onclick=()=>{np.bg=c;buildNewSheet()};g.append(b)});
}
function openNew(size=0){np.size=size;$('npname').value=t('untitled')+' '+(new Date()).toLocaleDateString(lang==='ar'?'ar':'en');buildNewSheet();showSheet($('newsheet'))}
$('newbtn').onclick=()=>openNew(0);
$('npcreate').onclick=async()=>{
  const [,,w,h]=SIZES[np.size];
  const p={id:uid(),name:$('npname').value.trim()||t('untitled'),w,h,fps:np.fps,bg:np.bg,layers:[{name:t('layer')+' 1',visible:true,opacity:1,locked:false,color:LCOL[0]}],frames:[[null]],updated:Date.now(),thumb:null};
  try{await idb('readwrite',s=>s.put(p))}catch(e){}
  closeSheets();openProject(p);
};

/* ---------- editor state ---------- */
let P=null,F=[],cur=0,curLayer=0,tool='brush',playing=false,clip=null;
const view={z:1,tx:0,ty:0,base:1};
let undoStack=[],redoStack=[],audio=null,audioURL=null,audioBlob=null,peaks=null,recent=[];
const fx=$('fx'),fxc=fx.getContext('2d'),onion=$('onioncv'),oc=onion.getContext('2d');
const MAXL=8;
const tiny=document.createElement('canvas');tiny.width=48;tiny.height=27;const tinyc=tiny.getContext('2d',{willReadFrequently:true});
function checkEmpty(c){tinyc.clearRect(0,0,48,27);tinyc.drawImage(c,0,0,48,27);const d=tinyc.getImageData(0,0,48,27).data;for(let i=3;i<d.length;i+=4)if(d[i])return c._empty=false;return c._empty=true}
function mkCanvas(){const c=document.createElement('canvas');c.width=P.w;c.height=P.h;c._dirty=true;c._empty=true;return c}
function newFrame(){return{id:uid(),layers:P.layers.map(()=>mkCanvas())}}

async function openProject(p){
  P=p;P.layers.forEach((l,i)=>{if(!l.color)l.color=LCOL[i%8];if(l.locked==null)l.locked=false});
  cur=0;curLayer=p.layers.length-1;undoStack=[];redoStack=[];clip=null;
  F=await Promise.all(p.frames.map(async fr=>({id:uid(),layers:await Promise.all(p.layers.map(async(_,i)=>{
    const c=mkCanvas();const b=fr[i];
    if(b){try{const bm=await createImageBitmap(b);c.getContext('2d').drawImage(bm,0,0);c._blob=b;c._dirty=false;checkEmpty(c)}catch(e){}}
    return c}))})));
  if(!F.length)F=[newFrame()];
  fx.width=onion.width=P.w;fx.height=onion.height=P.h;
  setRange($('fps'),P.fps);
  await setAudio(p.audio||null);
  $('home').classList.add('hidden');$('editor').classList.remove('hidden');
  if(isDesk())$('panel').classList.add('show');
  selectTab('brush');refreshAll();requestAnimationFrame(fit);setSaveState(1);syncUndo();
}
function refreshAll(){
  $('pname').textContent=P.name;$('stage').style.background=P.bg;
  $('fpsv').textContent=P.fps;$('fpschip').textContent=P.fps+' fps';
  buildBg();buildBrushes();buildPalette();buildRecent();
  showFrame(cur);buildStrip();buildLayers();buildGrid();setTool(tool);
}
function setSaveState(ok){$('savestate').textContent=ok?t('saved'):t('saving')}

/* ---------- stage / view ---------- */
function showFrame(i){

/* ---------- frames: mobile strip ---------- */
function buildStrip(){
  const s=$('strip');s.innerHTML='';const h=44;
  F.forEach((f,i)=>{const d=document.createElement('div');d.className='th'+(i===cur?' sel':'');d.dataset.i=i;
    const c=document.createElement('canvas');c.height=h*2;c.width=Math.round(c.height*P.w/P.h);f.thumb=c;d.style.width=Math.round(h*P.w/P.h)+'px';
    const l=document.createElement('span');l.textContent=i+1;d.append(c,l);d.onclick=()=>{if(!playing)showFrame(i)};s.append(d);updateThumb(i)});
  const a=document.createElement('button');a.className='th add';a.innerHTML=icon('plus');a.onclick=()=>act('add');s.append(a);
  const sel=s.querySelector('.th.sel');if(sel)sel.scrollIntoView({inline:'nearest',block:'nearest'});
}
function updateThumb(i){const f=F[i];if(!f||!f.thumb)return;composite(f,f.thumb.getContext('2d'),f.thumb.width,f.thumb.height)}

/* ---------- frames: desktop layer × frame grid ---------- */
function buildGrid(){
  const g=$('tgrid');g.innerHTML='';
  const head=document.createElement('div');head.className='tg-head';
  head.innerHTML=`<div class="tg-name label" style="font-size:11px">${t('tLayers')}</div>`;
  F.forEach((_,i)=>{const n=document.createElement('div');n.className='fnum';n.dataset.f=i;n.textContent=i+1;n.onclick=()=>{if(!playing)showFrame(i)};head.append(n)});
  const add=document.createElement('button');add.className='fnum';add.innerHTML=icon('plus',14);add.style.color='var(--soft)';add.onclick=()=>act('add');head.append(add);g.append(head);
  for(let l=P.layers.length-1;l>=0;l--){const L=P.layers[l];const r=document.createElement('div');r.className='tg-row';r.dataset.l=l;
    const nm=document.createElement('div');nm.className='tg-name';nm.innerHTML=`<span style="width:10px;height:10px;border-radius:3px;background:${L.color};flex:none"></span><span class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>`;nm.querySelector('.grow').textContent=L.name;
    const v=document.createElement('button');v.className='ib';v.title=L.visible?t('hide'):t('show');v.innerHTML=icon(L.visible?'eye':'eyeoff');v.style.color=L.visible?'var(--soft)':'#5B6378';v.onclick=e=>{e.stopPropagation();L.visible=!L.visible;afterLayerChange()};
    const k=document.createElement('button');k.className='ib';k.title=L.locked?t('unlock'):t('lock');k.innerHTML=icon(L.locked?'lock':'unlock');k.style.color=L.locked?'var(--coral-2)':'#5B6378';k.onclick=e=>{e.stopPropagation();L.locked=!L.locked;afterLayerChange()};
    nm.append(v,k);nm.onclick=()=>{curLayer=l;afterLayerChange(false)};r.append(nm);
    F.forEach((f,i)=>{const c=document.createElement('div');c.className='cell';c.dataset.f=i;c.dataset.l=l;c.innerHTML=`<i style="background:${L.color}"></i>`;c.onclick=()=>{curLayer=l;if(!playing)showFrame(i);buildLayers()};r.append(c)});
    g.append(r)}
  if(audioBlob){const r=document.createElement('div');r.className='tg-row';r.innerHTML=`<div class="tg-name"><span style="width:10px;height:10px;border-radius:3px;background:var(--sky);flex:none"></span><span>${t('audio')}</span></div><canvas id="wave" height="38" style="height:38px"></canvas>`;g.append(r);drawWave()}
  const ph=document.createElement('div');ph.id='playhead';g.append(ph);
  F.forEach((_,i)=>refreshCol(i));markGrid();
}
function refreshCol(i){document.querySelectorAll(`#tgrid .cell[data-f="${i}"]`).forEach(c=>{const cv=F[i]&&F[i].layers[+c.dataset.l];c.classList.toggle('blank',!cv||cv._empty);c.style.opacity=P.layers[+c.dataset.l].visible?1:.4})}
function markGrid(){const g=$('tgrid');if(!g.firstChild)return;
  g.querySelectorAll('.cell').forEach(c=>{const on=+c.dataset.f===cur;c.classList.toggle('cur',on);c.classList.toggle('on',on&&+c.dataset.l===curLayer)});
  g.querySelectorAll('.fnum[data-f]').forEach(n=>n.classList.toggle('cur',+n.dataset.f===cur));
  g.querySelectorAll('.tg-row[data-l]').forEach(r=>r.classList.toggle('sel',+r.dataset.l===curLayer));
  const ph=$('playhead');if(ph){ph.style.left=(220+cur*44+21)+'px';ph.style.height=(g.scrollHeight-24)+'px'}
  if(isDesk()){const x=220+cur*44;if(x<g.scrollLeft+220||x+44>g.scrollLeft+g.clientWidth)g.scrollLeft=x-260}
}
function drawWave(){const c=$('wave');if(!c||!peaks)return;const w=Math.max(44,Math.round(peaks.dur*P.fps*44));c.width=w;c.style.width=w+'px';const x=c.getContext('2d');x.clearRect(0,0,w,38);x.fillStyle='#4AA8FF';
  const n=Math.floor(w/4);for(let i=0;i<n;i++){const v=peaks.data[Math.floor(i/n*peaks.data.length)]||0;const h=Math.max(1.5,v*17);x.fillRect(i*4,19-h,2.4,h*2)}}

/* ---------- frame actions ---------- */
function cloneFrame(src){const f=newFrame();f.layers.forEach((c,k)=>{c.getContext('2d').drawImage(src.layers[k],0,0);c._empty=src.layers[k]._empty});return f}
function insertFrame(f){F.splice(cur+1,0,f);cur++;buildStrip();buildGrid();showFrame(cur);saveSoon()}
function moveFrame(d){const j=cur+d;if(j<0||j>=F.length)return;[F[cur],F[j]]=[F[j],F[cur]];cur=j;buildStrip();buildGrid();showFrame(cur);saveSoon()}
function act(a){if(playing)stop();
  if(a==='add')insertFrame(newFrame());
  else if(a==='dup')insertFrame(cloneFrame(F[cur]));
  else if(a==='copy'){clip=cloneFrame(F[cur]);toast(t('copied'))}
  else if(a==='paste'){if(clip&&clip.layers.length===P.layers.length){insertFrame(cloneFrame(clip));toast(t('pasted'))}}
  else if(a==='left')moveFrame(-1);else if(a==='right')moveFrame(1);
  else if(a==='del'){if(F.length<2)return;F.splice(cur,1);cur=Math.min(cur,F.length-1);buildStrip();buildGrid();showFrame(cur);saveSoon()}
  else if(a==='layers')openPanel('layers');else if(a==='scene')openPanel('scene');
}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
$('prevbtn').onclick=()=>{if(!playing)showFrame(cur-1)};$('nextbtn').onclick=()=>{if(!playing)showFrame(cur+1)};

/* ---------- playback ---------- */
let raf=0,last=0,acc=0;
function play(){
  if(playing)return stop();
  playing=true;const b=$('playbtn');b.classList.add('stop');b.innerHTML=icon('stop',22);
  if(cur>=F.length-1)cur=0;showFrame(cur);
  if(audio){audio.currentTime=cur/P.fps;audio.play().catch(()=>{})}
  last=performance.now();acc=0;
  const step=now=>{if(!playing)return;acc+=now-last;last=now;const dt=1000/P.fps;
    while(acc>=dt){acc-=dt;if(cur>=F.length-1){if($('loop').checked){cur=-1;if(audio)audio.currentTime=0}else{stop();return}}cur++}
    showFrame(cur);raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function stop(){playing=false;cancelAnimationFrame(raf);if(audio)audio.pause();const b=$('playbtn');b.classList.remove('stop');b.innerHTML=icon('play',24);showFrame(cur)}
$('playbtn').onclick=play;

/* ---------- audio ---------- */
async function setAudio(b){
  if(audioURL)URL.revokeObjectURL(audioURL);audio=null;audioURL=null;audioBlob=b||null;peaks=null;
  if(b){audioURL=URL.createObjectURL(b);audio=new Audio(audioURL);audio.preload='auto';
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();const buf=await ac.decodeAudioData(await b.arrayBuffer());const ch=buf.getChannelData(0),N=2000,step=Math.max(1,Math.floor(ch.length/N)),data=new Float32Array(N);let mx=0;
      for(let i=0;i<N;i++){let m=0;for(let j=i*step;j<(i+1)*step&&j<ch.length;j+=8)m=Math.max(m,Math.abs(ch[j]));data[i]=m;mx=Math.max(mx,m)}
      for(let i=0;i<N;i++)data[i]/=mx||1;peaks={data,dur:buf.duration};ac.close()}catch(e){}}
  $('audioname').textContent=b&&b.name?b.name:(b?'🎵':'');$('audiorm').classList.toggle('hidden',!b);
  if(P&&F.length)buildGrid();
}
$('audiobtn').onclick=()=>$('audiofile').click();
$('audiofile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;setAudio(f);P.audio=f;saveSoon()};
$('audiorm').onclick=()=>{setAudio(null);P.audio=null;saveSoon()};

/* ---------- save ---------- */
let saveT=null,saving=false;
function saveSoon(){setSaveState(0);clearTimeout(saveT);saveT=setTimeout(save,900)}
async function save(){
  if(!P)return;if(saving){saveSoon();return}saving=true;
  try{for(const f of F)for(const c of f.layers)if(c._dirty||!c._blob){c._blob=await new Promise(r=>c.toBlob(r,'image/png'));c._dirty=false}
    const th=document.createElement('canvas');th.width=320;th.height=Math.round(320*P.h/P.w);composite(F[0],th.getContext('2d'),th.width,th.height);
    P.frames=F.map(f=>f.layers.map(c=>c._blob));P.thumb=th.toDataURL('image/jpeg',.75);P.updated=Date.now();
    await idb('readwrite',s=>s.put(P));setSaveState(1);
  }catch(e){console.warn(e)}
  saving=false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&P)save()});
$('backbtn').onclick=async()=>{if(playing)stop();closeSheets();$('panel').classList.remove('show');clearTimeout(saveT);await save();P=null;F=[];$('editor').classList.add('hidden');$('home').classList.remove('hidden');renderHome()};

/* ---------- export ---------- */
let fmt='gif',quality=1;
const FMTS=[['gif','gif','fGif','fGifD'],['video','film','fVid','fVidD'],['png','image','fPng','fPngD'],['sheet','sheet','fSheet','fSheetD']];
function buildFormats(){const h=$('fmts');h.innerHTML='';for(const [k,ic,n,d] of FMTS){const b=document.createElement('button');b.className='opt fmt'+(k===fmt?' on':'');
  b.innerHTML=`<div class="ic">${icon(ic,21)}</div><div class="col" style="gap:2px;text-align:start"><span class="h3" style="font-size:15px">${t(n)}</span><span class="xs muted">${t(d)}</span></div><span class="ck">${icon('check',13)}</span>`;b.onclick=()=>{fmt=k;buildFormats()};h.append(b)}
  $('exgolabel').textContent=t('exportAs',{f:t(FMTS.find(f=>f[0]===fmt)[2])});
  $('exloop').closest('label').classList.toggle('hidden',fmt!=='gif');
}
document.querySelectorAll('#quality button').forEach(b=>b.onclick=()=>{quality=+b.dataset.q;document.querySelectorAll('#quality button').forEach(x=>x.classList.toggle('on',x===b))});
$('exportbtn').onclick=()=>{if(playing)stop();
  const c=$('exthumb');c.height=Math.round(c.width*P.h/P.w);c.style.height=Math.round(96*P.h/P.w)+'px';composite(F[cur],c.getContext('2d'),c.width,c.height);
  $('exname').textContent=P.name;$('exmeta').textContent=`${F.length} ${t('frames')} • ${P.fps} fps • ${(F.length/P.fps).toFixed(1)}${t('sec')}`;$('exsize').textContent=`${P.w} × ${P.h}`;
  buildFormats();showSheet($('expsheet'))};
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
const fname=ext=>(P.name.replace(/[\\/:*?"<>|]+/g,'').trim()||'doodleflip')+'.'+ext;
function flat(i,w=P.w,h=P.h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');composite(F[i],x,w,h);
  if($('exwm').checked){const s=Math.max(12,Math.round(h*.04));x.font=`700 ${s}px Inter,sans-serif`;x.textAlign='right';x.textBaseline='bottom';x.fillStyle='rgba(27,30,39,.45)';x.fillText('Doodleflip',w-s*.6,h-s*.4)}
  return c}
function busy(on,label){$('exgo').disabled=on;$('exgolabel').textContent=label||t('exportAs',{f:t(FMTS.find(f=>f[0]===fmt)[2])})}
$('exgo').onclick=async()=>{
  try{
    if(fmt==='png'){flat(cur).toBlob(b=>download(b,fname(`frame${cur+1}.png`)));return toast(t('done'))}
    if(fmt==='sheet'){const cols=Math.ceil(Math.sqrt(F.length)),rows=Math.ceil(F.length/cols),s=Math.min(1,4096/(cols*P.w),4096/(rows*P.h));
      const w=Math.round(P.w*s),h=Math.round(P.h*s),c=document.createElement('canvas');c.width=cols*w;c.height=rows*h;const x=c.getContext('2d');
      F.forEach((_,i)=>x.drawImage(flat(i,w,h),(i%cols)*w,Math.floor(i/cols)*h));c.toBlob(b=>download(b,fname('sheet.png')));return toast(t('done'))}
    if(fmt==='gif'){const lim=[480,720,1280][quality];const s=Math.min(1,lim/Math.max(P.w,P.h)),w=Math.round(P.w*s),h=Math.round(P.h*s);
      const datas=F.map((_,i)=>flat(i,w,h).getContext('2d').getImageData(0,0,w,h).data);
      const blob=await encodeGif(w,h,datas,Math.max(2,Math.round(100/P.fps)),$('exloop').checked,n=>busy(true,t('encoding',{n,m:F.length})));
      download(blob,fname('gif'));busy(false);return toast(t('done'))}
    if(fmt==='video')await exportVideo();
  }catch(err){busy(false);toast(String(err.message||err))}
};
$('exjson').onclick=async()=>{clearTimeout(saveT);await save();
  const toURL=b=>b?new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)}):null;
  const frames=await Promise.all(F.map(f=>Promise.all(f.layers.map(c=>c._empty?null:toURL(c._blob)))));
  download(new Blob([JSON.stringify({app:'doodleflip',v:2,name:P.name,w:P.w,h:P.h,fps:P.fps,bg:P.bg,layers:P.layers,frames,thumb:P.thumb})],{type:'application/json'}),fname('json'))};
function buildPalette256(datas){
  const cnt=new Uint32Array(32768);for(const d of datas)for(let i=0;i<d.length;i+=8)cnt[(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3)]++;
  const keys=[];for(let k=0;k<32768;k++)if(cnt[k])keys.push(k);keys.sort((a,b)=>cnt[b]-cnt[a]);
  const pal=[];for(const k of keys){const c=[(k>>10&31)<<3|4,(k>>5&31)<<3|4,(k&31)<<3|4];if(pal.every(p=>Math.abs(p[0]-c[0])+Math.abs(p[1]-c[1])+Math.abs(p[2]-c[2])>12))pal.push(c);if(pal.length===256)break}
  while(pal.length<256)pal.push([0,0,0]);return pal;
}
function lzw(ix,minSize){
  const clear=1<<minSize,eoi=clear+1;let size=minSize+1,next=eoi+1,dict=new Map(),out=[],c=0,bits=0;
  const emit=v=>{c|=v<<bits;bits+=size;while(bits>=8){out.push(c&255);c>>>=8;bits-=8}};
  emit(clear);let pre=ix[0];
  for(let i=1;i<ix.length;i++){const k=ix[i],key=pre<<8|k,v=dict.get(key);if(v!==undefined){pre=v;continue}
    emit(pre);if(next===4096){emit(clear);dict=new Map();next=eoi+1;size=minSize+1}else{if(next>=1<<size)size++;dict.set(key,next++)}pre=k}
  emit(pre);emit(eoi);if(bits>0)out.push(c&255);return out;
}
async function encodeGif(w,h,datas,delay,loop,prog){
  const pal=buildPalette256(datas),cache=new Int16Array(32768).fill(-1);
  const near=(r,g,b)=>{const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let v=cache[k];if(v>=0)return v;let best=0,bd=1e9;for(let i=0;i<256;i++){const p=pal[i],d=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(d<bd){bd=d;best=i}}cache[k]=best;return best};
  const out=[];const w16=v=>out.push(v&255,v>>8&255);
  out.push(71,73,70,56,57,97);w16(w);w16(h);out.push(0xF7,0,0);for(const p of pal)out.push(p[0],p[1],p[2]);
  if(loop)out.push(0x21,0xFF,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
  for(let f=0;f<datas.length;f++){const d=datas[f],ix=new Uint8Array(w*h);for(let i=0,j=0;j<ix.length;i+=4,j++)ix[j]=near(d[i],d[i+1],d[i+2]);
    out.push(0x21,0xF9,4,0x04);w16(delay);out.push(0,0);out.push(0x2C);w16(0);w16(0);w16(w);w16(h);out.push(0,8);
    const data=lzw(ix,8);for(let i=0;i<data.length;i+=255){const ch=data.slice(i,i+255);out.push(ch.length);for(const b of ch)out.push(b)}
    out.push(0);prog(f+1);await sleep(0)}
  out.push(0x3B);return new Blob([new Uint8Array(out)],{type:'image/gif'});
}
async function exportVideo(){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error(t('noVideo'));
  const lim=[720,1280,1920][quality];const s=Math.min(1,lim/Math.max(P.w,P.h));let w=Math.round(P.w*s),h=Math.round(P.h*s);w-=w%2;h-=h%2;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(flat(0,w,h),0,0);
  const stream=c.captureStream(0),vt=stream.getVideoTracks()[0],tick=()=>vt.requestFrame&&vt.requestFrame();
  let actx=null,el=null;
  if(audioBlob){el=new Audio(URL.createObjectURL(audioBlob));actx=new AudioContext();const src=actx.createMediaElementSource(el),dest=actx.createMediaStreamDestination();src.connect(dest);dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr))}
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:[2e6,5e6,10e6][quality]}:undefined);
  const parts=[];rec.ondataavailable=ev=>ev.data.size&&parts.push(ev.data);const stopped=new Promise(r=>rec.onstop=r);
  rec.start(250);if(el){el.currentTime=0;await el.play().catch(()=>{})}
  const t0=performance.now(),dt=1000/P.fps;
  for(let i=0;i<F.length;i++){x.drawImage(flat(i,w,h),0,0);tick();busy(true,t('recording',{n:i+1,m:F.length}));const wait=t0+(i+1)*dt-performance.now();if(wait>0)await sleep(wait)}
  const until=t0+Math.max(F.length*dt,1200)+250;while(performance.now()<until){tick();await sleep(100)}
  rec.stop();await stopped;if(el){el.pause();URL.revokeObjectURL(el.src)}if(actx)actx.close();
  busy(false);if(!parts.length)throw new Error(t('noVideo'));
  download(new Blob(parts,{type:rec.mimeType||'video/webm'}),fname((rec.mimeType||mime).includes('mp4')?'mp4':'webm'));toast(t('done'));
}

/* ---------- keyboard ---------- */
const KEYS={b:'brush',p:'pencil',m:'marker',e:'eraser',f:'fill',l:'line',r:'rect',o:'ellipse',i:'picker',h:'hand'};
addEventListener('keydown',e=>{
  if(!P||$('editor').classList.contains('hidden'))return;
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range'&&e.target.type!=='checkbox')return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(e.key==='Escape'){closeSheets();closeMenu();return}
  if(mod&&k==='z'){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click();return}
  if(mod&&k==='y'){e.preventDefault();$('redo').click();return}
  if(mod&&k==='c'){act('copy');return}if(mod&&k==='v'){act('paste');return}
  if(mod||e.altKey)return;
  if(k===' '){e.preventDefault();play()}
  else if(e.key==='ArrowLeft'||k===','){e.preventDefault();if(!playing)showFrame(cur-1)}
  else if(e.key==='ArrowRight'||k==='.'){e.preventDefault();if(!playing)showFrame(cur+1)}
  else if(k==='n')act('add');else if(k==='d')act('dup');
  else if(k==='[')syncSize(Math.max(1,SIZE()-2));else if(k===']')syncSize(Math.min(120,SIZE()+2));
  else if(KEYS[k])setTool(KEYS[k]);
});

$('logo').innerHTML=blip(36,0);$('heroart').innerHTML=blip(150,2);$('heroart2').innerHTML=blip(70,4,'#fff');
syncSize(8);syncOp(100);setRange($('smooth'),40);$('smv').textContent='40%';setRange($('obefore'),1);setRange($('oafter'),1);$('obv').textContent=1;$('oav').textContent=1;
setColor('#1B1E27');selectTab('brush');
applyLang();buildTemplates();renderHome();buildNewSheet();buildFormats();
