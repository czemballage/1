name: Build APK
run-name: ${{ startsWith(github.ref_name, 'apk-build/') && format('APK {0}', github.ref_name) || format('APK sample build ({0})', github.ref_name) }}

# Builds requested by the website arrive as a push to apk-build/<id>: a commit with
# apk-builder/input/{build.json,site.zip,icon.png}. The APK is published as a prerelease
# tagged apk-<id> and the branch is deleted. Pushes that change the builder itself build
# the repo's own index.html as a smoke test and upload it as a workflow artifact.
on:
  push:
    branches:
      - "apk-build/**"
      - main
      - "ccr-*"
    paths:
      - "apk-builder/**"
      - ".github/workflows/build-apk.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IS_REQUEST: ${{ startsWith(github.ref_name, 'apk-build/') }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build input
        id: input
        run: |
          if [ "$IS_REQUEST" = "true" ]; then
            id="${GITHUB_REF_NAME#apk-build/}"
            if ! [[ "$id" =~ ^[a-z0-9]{8,40}$ ]]; then echo "::error::Bad build id"; exit 1; fi
            echo "id=$id" >> "$GITHUB_OUTPUT"
            echo "dir=apk-builder/input" >> "$GITHUB_OUTPUT"
          else
            dir="$RUNNER_TEMP/sample-input"
            mkdir -p "$dir"
            zip -j -q "$dir/site.zip" index.html
            cp apk-builder/branding/czemballage/icon-512.png "$dir/icon.png"
            # Every run gets a higher version code, so each AAB can be uploaded to Google Play.
            cat > "$dir/build.json" <<JSON
          {"appName":"CZ Emballage","packageId":"com.czemballage.app","versionName":"1.0.$GITHUB_RUN_NUMBER","versionCode":$GITHUB_RUN_NUMBER,"mode":"html","themeColor":"#1A1A1A","iconBackground":"#1A1A1A"}
          JSON
            echo "id=sample" >> "$GITHUB_OUTPUT"
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare Android project
        run: node apk-builder/scripts/prepare.mjs "${{ steps.input.outputs.dir }}" apk-builder/android

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            { echo "APK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "APK_KEY_ALIAS=$KEY_ALIAS"; echo "APK_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"; } >> "$GITHUB_ENV"
          else
            # No shared key configured: sign with a one-off key (fine for sideloading).
            pass="$(openssl rand -hex 16)"
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass "$pass" -keypass "$pass" \
              -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HTML2APK" >/dev/null
            { echo "APK_KEYSTORE_PASSWORD=$pass"; echo "APK_KEY_ALIAS=app"; echo "APK_KEY_PASSWORD=$pass"; } >> "$GITHUB_ENV"
          fi
          echo "APK_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p apk-builder/android --no-daemon assembleRelease bundleRelease

      - name: Collect APK
        id: apk
        run: |
          apk="$(ls apk-builder/android/app/build/outputs/apk/release/*.apk | head -n1)"
          out="$RUNNER_TEMP/app.apk"
          cp "$apk" "$out"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$out" | head -n5
          ls -l "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Publish download
        if: env.IS_REQUEST == 'true'
        run: |
          gh release create "apk-${{ steps.input.outputs.id }}" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "APK build ${{ steps.input.outputs.id }}" \
            --notes "Built automatically by the HTML to APK website. Deleted after 24 hours."

      - name: Upload sample APK
        if: env.IS_REQUEST != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sample-apk
          path: ${{ steps.apk.outputs.path }}

      # Keep a permanent public download of the repo's own site as an app.
      - name: Publish CZ Emballage app
        if: env.IS_REQUEST != 'true'
        run: |
          cp "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/CZ-Emballage.apk"
          cp apk-builder/android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/CZ-Emballage.aab"
          gh release delete app-czemballage --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create app-czemballage "$RUNNER_TEMP/CZ-Emballage.apk" "$RUNNER_TEMP/CZ-Emballage.aab" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "CZ Emballage Android app (version code $GITHUB_RUN_NUMBER)" \
            --notes "Built from index.html. CZ-Emballage.apk installs directly on a phone. CZ-Emballage.aab is the Google Play bundle; sign it with your upload key before uploading."

      - name: Delete build branch
        if: always() && env.IS_REQUEST == 'true'
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || true

      - name: Remove builds older than 24 hours
        if: always() && env.IS_REQUEST == 'true'
        run: |
          cutoff="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"apk-\")) | select(.createdAt < \"$cutoff\") | .tagName" |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
