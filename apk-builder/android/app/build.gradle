plugins {
    id "com.android.application"
}

// All per-app values come from app-config.properties, written by scripts/prepare.mjs.
def cfg = new Properties()
def cfgFile = file("app-config.properties")
if (cfgFile.exists()) cfgFile.withReader("UTF-8") { cfg.load(it) }

android {
    namespace "app.html2apk"
    compileSdk 36

    defaultConfig {
        applicationId cfg.getProperty("applicationId", "com.example.html2apk")
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(cfg.getProperty("versionCode", "1"))
        versionName cfg.getProperty("versionName", "1.0")
    }

    signingConfigs {
        release {
            def ks = System.getenv("APK_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("APK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("APK_KEY_ALIAS")
                keyPassword System.getenv("APK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
